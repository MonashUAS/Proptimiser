[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "proptimiser"
version = "0.1.0"
description = "Propeller design tool: BEMT in JAX, optimiser, structural loads and Creo .ibl export."
readme = "README.md"
requires-python = ">=3.12"
license = "Unlicense"
license-files = ["LICENSE"]
keywords = ["propeller", "BEMT", "aerodynamics", "optimisation", "JAX"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "jax>=0.4.35",
    "jaxopt>=0.8",
    "optax>=0.2",
    "equinox>=0.11",
    "interpax>=0.3",
    "NeuralFoil>=0.3",
    "AeroSandbox>=4.2",
    "casadi>=3.6",
    "matplotlib>=3.9",
    "PyYAML>=6.0",
    "h5py>=3.10",
]

[project.optional-dependencies]
gui = ["PySide6>=6.7", "pyvista>=0.44", "pyvistaqt>=0.11"]
dev = ["pytest>=8"]

[project.scripts]
proptimiser-export = "proptimiser.export_performance:main"

[project.gui-scripts]
proptimiser-gui = "proptimiser.app:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
proptimiser = ["airfoils/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
