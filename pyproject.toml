[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "proptimiser"
version = "0.1.0"
description = "Propeller design tool: BEMT (JAX and CasADi), optimiser, structural loads and Creo .ibl export."
readme = "README.md"
requires-python = ">=3.12"
license = "Unlicense"
license-files = ["LICENSE"]
keywords = ["propeller", "BEMT", "aerodynamics", "optimisation", "JAX"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "NeuralFoil>=0.3",
    "AeroSandbox>=4.2",
    "casadi>=3.6",
    "PyYAML>=6.0",
    "h5py>=3.10",
]

[project.optional-dependencies]
# The CasADi path (casadi_prop.PropellerModel) needs none of these. The JAX solver, the optimiser, the structure
# model, the plots and the table interpolators need the jax extra.
jax = [
    "jax>=0.4.35",
    "jaxopt>=0.8",
    "optax>=0.2",
    "equinox>=0.11",
    "interpax>=0.3",
    "matplotlib>=3.9",
]
gui = ["proptimiser[jax]", "PySide6>=6.7", "pyvista>=0.44", "pyvistaqt>=0.11"]
dev = ["proptimiser[jax]", "pytest>=8"]
# The STEP solid of the outer mould line (geometry.export_propeller_step): OpenCascade for Python.
cad = ["cadquery-ocp==8.0.1.1.0"]

[project.scripts]
proptimiser-export = "proptimiser.export_performance:main"
proptimiser-cad = "proptimiser.cad_export:main"

[project.gui-scripts]
proptimiser-gui = "proptimiser.app:run"

# The wheel holds the proptimiser package only, with its airfoil data.
[tool.hatch.build.targets.wheel]
packages = ["proptimiser"]

[tool.hatch.build.targets.sdist]
include = ["proptimiser", "tests", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
