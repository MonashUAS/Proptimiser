# Proptimiser design: Currawong_V1
# The tested blade, taken from Proptimiser 51bf638, propellers/prop_params_Currawong_V1.eqx (the same bytes as 588118a). The Equinox file is history: this YAML and the state JSON replace it.
# Not in the old file, so assumed: airfoil clarky (the airfoil of the old loader: it matches the 59.4 N at 680 rad/s of the old table to 0.6 %, arad10 is 4 % off), the second flight condition and the
# motor (class defaults of 51bf638), and all optimiser settings (copied from Currawong_V1_resolve).
# The old file saved R_tip = 0.275 m (class default) for the tip loss. The blade ends at 0.254 m. This file uses 0.254.
# Motor chain (MAD X5220 KV220 behind the AMPX 80A ESC), copied by hand from Propalyser: I_0 and kV from
# components/motors/MAD_X5220_KV220/component.yaml, kappa 1.066 and R_tot 0.156 ohm from the fit to the maker table
# (propalyser/estimate/chain.py, 1.4 % rpm error), V_bus 44.4 V = 12S nominal (components/batteries/NXE_4500HC506SXT90).
# Q0 is 0: no source fits a friction torque.
# Units: SI. Lengths m, speeds m/s, omega rad/s, thrust N, power W, I_0 A, R_tot ohm, kV rpm/V, kappa nd, Q0 Nm, V_bus V,
# density kg/m^3, E, G and allowable stresses Pa. Angles in degrees: every key that ends in _deg.
# Dimensionless (nd): weights, tolerances, ratios, CST weights, fill_factor.
# Every key is required. An unknown key is an error. Write floats with a dot (1.0e-8, not 1e-8).
format_version: 2
inputs:
  opt_solver: L-BFGS-B
  opt_max_iter: 2000
  opt_tol: 1.0e-06
  opt_verbose: 1
  opt_print_every: 5
  V_i_0_max_iter: 50
  V_i_0_eps: 1.0e-08
  V_i_0_verbose: 0
  bemt_type: [true, true, false]
  n_r: 25
  n_psi: 24
  jax_tracing: false
  thrust_target: [15.9, 60.0]
  V_x: [18.0, 0.8]
  V_yz: [3.0, 3.0]
  omega: [588.0, 680.0]
  tilt_deg: [0.0, 0.0]
  solve_omega: [false, false]
  solve_tilt: [false, false]
  objective_weight: [0.9, 0.1]
  I_0: 2.0
  R_tot: 0.156
  kV: 220.0
  kappa: 1.066
  Q0: 0.0
  V_bus: 44.4
  P_max: 3300.0
  w_thrust: 10000.0
  thrust_tol: 0.01
  w_thickness: 10.0
  w_confidence: 1.0
  w_smooth: 0.01
  min_confidence: 0.9
  inflow_model: 1
  coeff_method: 3
  tip_loss_model: 1
  root_loss_model: 1
  rot_corr_model: 1
  high_induction_model: 0
blade:
  N: 2
  r_foils: [0.0, 0.025, 0.03454166666666667, 0.1395, 0.254]
  airfoils: [clarky, clarky, clarky]
  hub_chord: 0.02944096264384126
  hub_twist_deg: 18.3481177151224
  hub_thickness_ratio: 0.1
  hub_cst: [-0.14205177884477468, -0.06507373696962053, 0.04987802085759376, -0.08044541552452188, 0.049869787712093036, -0.02303917761929696, -0.006687037462066634, -0.0018777443606322179, 0.24510672422685056, 0.21957201466331955, 0.19528647820164557, 0.2677156259469917, 0.18509441587562928, 0.2252697145544583, 0.21758725322854905, 0.20116917779940427, 0.11422146231884805, 0.014972235533134365]
  freeze: {}
  optimise_cst: true
  c_bounds: [0.001, 0.2]
  beta_bounds_deg: [0.0, 50.0]
  cst_bound: 0.25
  min_tc: 0.06
  offset_r: []
  offset_y: []
  offset_z: []
  mat_density: 1700.0
  mat_E: 19700000000.0
  mat_G: 7300000000.0
  mat_sigma_allow: 60000000.0
  mat_tau_allow: 0.0
  fill_factor: 1.0
