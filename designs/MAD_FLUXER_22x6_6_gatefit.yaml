# This is the first fit (equal weight on thrust and power against rpm). It passes the rpm gate but has thrust 6 % low. See docs/fluxer_22x6_6.md.
# FITTED model of the MAD FLUXER PRO 22x6.6 MATT. It is not a measurement and not the maker geometry.
# No blade geometry of this propeller is public. Chord and twist come from the 5-parameter family of
# proptimiser.fit_prop (blade_family), fitted to designs/MAD_FLUXER_22x6_6_chart.csv with the BEMT.
# Fitted parameters c75_over_R = 0.1004, dtheta_deg = 2.0041, a_inboard = 0.1270, b_tip = 0.3384, pitch_gradient = 0.0071.
# The sections are Clark-Y, an assumption. The motor keys (I_0, R_tot, kappa, Q0, P_max) are class
# defaults and do not describe the MAD M6C10 IPE V3. The export does not use them. kV 150 is the maker value.
# The design condition is the hover point: 3200 rpm, 22.4 N, V_x = 0.
# Proptimiser design: MAD_FLUXER_22x6_6
# Units: SI. Lengths m, speeds m/s, omega rad/s, thrust N, power W, I_0 A, R_tot ohm, kV rpm/V, kappa nd, Q0 Nm, V_bus V,
# density kg/m^3, E, G and allowable stresses Pa. Angles in degrees: every key that ends in _deg.
# Dimensionless (nd): weights, tolerances, ratios, CST weights, fill_factor.
# Every key is required. An unknown key is an error. Write floats with a dot (1.0e-8, not 1e-8).
